<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Business Dashboard</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.filter{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin:20px 0;
}

.filter div{
    flex:1;
}

input{
    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    margin-top:23px;
}

.cards{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:20px;

}

.card{

    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);

}

.card h3{
    margin:0;
    color:#555;
}

.amount{

    margin-top:15px;
    font-size:32px;
    font-weight:bold;

}

.received{
    border-left:8px solid green;
}

.paid{
    border-left:8px solid red;
}

.sales{
    border-left:8px solid blue;
}

.purchase{
    border-left:8px solid orange;
}

.net{
    border-left:8px solid purple;
}

.profit{
    border-left:8px solid teal;
}

</style>

</head>

<body>

<h1>Business Dashboard</h1>

<div class="filter">

<div>
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div>
<label>To Date</label>
<input type="date" id="toDate">
</div>

<div>
<button onclick="loadDashboard()">Search</button>
</div>

</div>

<div class="cards">

<div class="card received">
<h3>Payment Received</h3>
<div class="amount">₹ <span id="paymentReceived">0</span></div>
</div>

<div class="card paid">
<h3>Supplier Payment Paid</h3>
<div class="amount">₹ <span id="paymentPaid">0</span></div>
</div>

<div class="card sales">
<h3>Total Sales</h3>
<div class="amount">₹ <span id="salesTotal">0</span></div>
</div>

<div class="card purchase">
<h3>Total Purchase</h3>
<div class="amount">₹ <span id="purchaseTotal">0</span></div>
</div>

<div class="card net">
<h3>Net Collection</h3>
<div class="amount">₹ <span id="netCollection">0</span></div>
</div>

<div class="card profit">
<h3>Gross Profit</h3>
<div class="amount">₹ <span id="grossProfit">0</span></div>
</div>

<div class="card" style="border-left:8px solid crimson;">
    <h3>Buyer Outstanding</h3>
    <div class="amount">₹ <span id="buyerOutstanding">0</span></div>
</div>

<div class="card" style="border-left:8px solid brown;">
    <h3>Supplier Outstanding</h3>
    <div class="amount">₹ <span id="supplierOutstanding">0</span></div>
</div>

<div class="card" style="border-left:8px solid #ff0066;">
    <h3>Buyer Outstanding %</h3>
    <div class="amount"><span id="buyerPercent">0</span>%</div>
</div>

<div class="card" style="border-left:8px solid #8B4513;">
    <h3>Supplier Outstanding %</h3>
    <div class="amount"><span id="supplierPercent">0</span>%</div>
</div>

</div>

<script type="module">










    
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBOw2CG4-8JWYNl5hf3aR7yCPjcPI41IC0",
  authDomain: "ommtaxsolutions.firebaseapp.com",
  projectId: "ommtaxsolutions",
  storageBucket: "ommtaxsolutions.firebasestorage.app",
  messagingSenderId: "944702919466",
  appId: "1:944702919466:web:6f37b36e1d5cf6d7a54453",
  measurementId: "G-NNTHM5Y4B8"


};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "https://ommtaxsurada-sudo.github.io/ommtaxlogin/";
        return;
    }

    console.log("Authorized user:", user.uid);

});


    

window.db = db;
async function getTotal(collectionName, amountField){

    let from=document.getElementById("fromDate").value;
    let to=document.getElementById("toDate").value;

    let total=0;

    const snapshot=await getDocs(collection(db,collectionName));

    snapshot.forEach(doc=>{

        let data=doc.data();

        let ok=true;

        if(from && data.date<from) ok=false;

        if(to && data.date>to) ok=false;

        if(ok){

            total+=Number(data[amountField] || 0);

        }

    });

    return total;

}

window.loadDashboard=async function(){

    let paymentReceived=await getTotal("payments","payment");

    let paymentPaid=await getTotal("supplierPayments","payment");

    let sales=await getTotal("sales","payment");

    let purchase=await getTotal("purchases","payment");
    let buyerOutstanding = sales - paymentReceived;
    let supplierOutstanding = purchase - paymentPaid;

    document.getElementById("paymentReceived").innerHTML=
    paymentReceived.toLocaleString('en-IN');

    document.getElementById("paymentPaid").innerHTML=
    paymentPaid.toLocaleString('en-IN');

    document.getElementById("salesTotal").innerHTML=
    sales.toLocaleString('en-IN');

    document.getElementById("purchaseTotal").innerHTML=
    purchase.toLocaleString('en-IN');

    document.getElementById("netCollection").innerHTML=
    (paymentReceived-paymentPaid).toLocaleString('en-IN');

    document.getElementById("grossProfit").innerHTML=
    (sales-purchase).toLocaleString('en-IN');
    document.getElementById("buyerOutstanding").innerHTML =
    buyerOutstanding.toLocaleString('en-IN');

    document.getElementById("supplierOutstanding").innerHTML =
    supplierOutstanding.toLocaleString('en-IN');
  

let buyerPercent = sales > 0
    ? ((buyerOutstanding / sales) * 100).toFixed(2)
    : 0;

let supplierPercent = purchase > 0
    ? ((supplierOutstanding / purchase) * 100).toFixed(2)
    : 0;

document.getElementById("buyerOutstanding").innerHTML =
    buyerOutstanding.toLocaleString('en-IN');

document.getElementById("supplierOutstanding").innerHTML =
    supplierOutstanding.toLocaleString('en-IN');

document.getElementById("buyerPercent").innerHTML = buyerPercent;
document.getElementById("supplierPercent").innerHTML = supplierPercent;
}

loadDashboard();

/* Disable right-click */
document.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});


/* Disable F12 */
document.addEventListener("keydown", function(event) {

    if (event.key === "F12") {
        event.preventDefault();
    }

    /* Disable Ctrl + Shift + I */
    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "i"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + Shift + J */
    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "j"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + U */
    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "u"
    ) {
        event.preventDefault();
    }

    /* Disable Ctrl + S */
    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "s"
    ) {
        event.preventDefault();
    }

});


    
</script>

</body>
</html>
